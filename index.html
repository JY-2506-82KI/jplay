<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Digital Songbook</title>
  <style>
    :root {
      --bg: #121212;
      --text: #e0e0e0;
      --chord: #4fc3f7;
      --meta: #b0bec5;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      line-height: 1.5;
    }
    h1 { margin: 0 0 4px 0; font-size: 1.8rem; color: #fff; }
    .meta { color: var(--meta); font-size: 0.9rem; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .song-body { font-family: "Courier New", Courier, monospace; font-size: 1.1rem; white-space: pre-wrap; }
    .line { display: flex; flex-wrap: wrap; margin-bottom: 8px; }
    .pair { display: inline-flex; flex-direction: column; align-items: flex-start; margin-right: 2px; }
    .chord { color: var(--chord); font-weight: bold; font-size: 0.95rem; min-height: 1.2em; }
    .lyric { white-space: pre; }
    .error-msg { color: #ff5252; background: #2a1212; padding: 12px; border-radius: 6px; }
  </style>
</head>
<body>

  <div id="song">
    <h1 id="title">Loading Song...</h1>
    <div class="meta" id="meta"></div>
    <div class="song-body" id="song-body"></div>
  </div>

  <script>
    // Keep phone screen awake
    if ('wakeLock' in navigator) {
      navigator.wakeLock.request('screen').catch(() => {});
    }

    // Get target song from URL parameter (defaults to wagon-wheel.txt or active file)
    const urlParams = new URLSearchParams(window.location.search);
    const songFile = urlParams.get('song') || 'crazy-eddies-last-hurrah.txt';

    fetch(`songs/${songFile}`)
      .then(res => {
        if (!res.ok) throw new Error(`Could not find "songs/${songFile}" in your repository.`);
        return res.text();
      })
      .then(text => renderSong(text))
      .catch(err => {
        document.getElementById('title').textContent = "Unable to Load Song";
        document.getElementById('song-body').innerHTML = `<div class="error-msg">${err.message}<br><br>Make sure the file exists in your <b>songs/</b> folder!</div>`;
      });

    function renderSong(rawText) {
      const container = document.getElementById('song-body');
      container.innerHTML = '';

      const lines = rawText.split('\n');
      let pendingChords = null;

      // Regex to identify lines that contain only chord symbols
      const chordLineRegex = /^\s*([A-G][b#]?(m|maj|min|dim|aug|sus|[0-9])*\s*)+$/;

      lines.forEach(line => {
        // Parse title headers
        if (line.startsWith('# ')) {
          document.getElementById('title').textContent = line.replace('# ', '');
          return;
        }

        // 1. Bracketed ChordPro lines ([G]Heading [D]down...)
        if (line.includes('[') && line.includes(']')) {
          if (pendingChords) { renderPlain(pendingChords, container); pendingChords = null; }
          renderBracketed(line, container);
        } 
        // 2. Lines consisting only of chords
        else if (chordLineRegex.test(line) && line.trim().length > 0) {
          if (pendingChords) { renderPlain(pendingChords, container); }
          pendingChords = line;
        } 
        // 3. Lyrics immediately following a chord line
        else {
          if (pendingChords) {
            renderChordLyricPair(pendingChords, line, container);
            pendingChords = null;
          } else {
            renderPlain(line, container);
          }
        }
      });

      if (pendingChords) {
        renderPlain(pendingChords, container);
      }
    }

    function renderBracketed(lineText, container) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      const regex = /(?:\[([^\]]+)\])?([^\[]*)/g;
      let match;

      while ((match = regex.exec(lineText)) !== null) {
        if (!match[0]) break;
        const pairDiv = document.createElement('div');
        pairDiv.className = 'pair';

        const chordSpan = document.createElement('span');
        chordSpan.className = 'chord';
        chordSpan.textContent = match[1] || '';

        const lyricSpan = document.createElement('span');
        lyricSpan.className = 'lyric';
        lyricSpan.textContent = match[2] || '';

        pairDiv.appendChild(chordSpan);
        pairDiv.appendChild(lyricSpan);
        lineDiv.appendChild(pairDiv);
      }
      container.appendChild(lineDiv);
    }

    function renderChordLyricPair(chords, lyrics, container) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      const maxLen = Math.max(chords.length, lyrics.length);

      let i = 0;
      while (i < maxLen) {
        let chordSegment = '';
        if (chords[i] && chords[i] !== ' ') {
          let j = i;
          while (j < chords.length && chords[j] !== ' ') {
            chordSegment += chords[j];
            j++;
          }
        }

        const pairDiv = document.createElement('div');
        pairDiv.className = 'pair';

        const chordSpan = document.createElement('span');
        chordSpan.className = 'chord';
        chordSpan.textContent = chordSegment;

        const lyricSpan = document.createElement('span');
        lyricSpan.className = 'lyric';
        lyricSpan.textContent = lyrics[i] || ' ';

        pairDiv.appendChild(chordSpan);
        pairDiv.appendChild(lyricSpan);
        lineDiv.appendChild(pairDiv);
        i++;
      }
      container.appendChild(lineDiv);
    }

    function renderPlain(text, container) {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'line';
      lineDiv.textContent = text;
      container.appendChild(lineDiv);
    }
  </script>
</body>
</html>
