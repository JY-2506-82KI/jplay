<script>
  // Keep screen awake
  if ('wakeLock' in navigator) {
    navigator.wakeLock.request('screen').catch(() => {});
  }

  const urlParams = new URLSearchParams(window.location.search);
  const songFile = urlParams.get('song') || 'crazy-eddies-last-hurrah.txt';

  fetch(`songs/${songFile}`)
    .then(res => res.text())
    .then(text => renderSong(text))
    .catch(() => {
      document.getElementById('title').textContent = "Error Loading Song";
    });

  function renderSong(rawText) {
    const container = document.getElementById('song-body');
    container.innerHTML = '';

    const lines = rawText.split('\n');
    let chordLine = null;

    // Helper: Detect if a line consists only of chord names
    const isChordLine = (line) => {
      const tokens = line.trim().split(/\s+/);
      if (tokens.length === 0 || tokens[0] === '') return false;
      const chordRegex = /^[A-G][b#]?(m|maj|min|dim|aug|sus|[0-9])*/;
      return tokens.every(token => chordRegex.test(token));
    };

    lines.forEach(line => {
      // Handle metadata headers
      if (line.startsWith('# ')) {
        document.getElementById('title').textContent = line.replace('# ', '');
        return;
      }

      // Check for bracketed ChordPro vs Traditional Chords-Over-Lyrics
      if (line.includes('[') && line.includes(']')) {
        renderChordProLine(line, container);
      } else if (isChordLine(line)) {
        chordLine = line; // Save chord line for the upcoming lyric line
      } else {
        if (chordLine) {
          renderTwoLinePair(chordLine, line, container);
          chordLine = null;
        } else {
          renderPlainLine(line, container);
        }
      }
    });
  }

  // Render traditional chords positioned directly over text
  function renderTwoLinePair(chords, lyrics, container) {
    const lineDiv = document.createElement('div');
    lineDiv.className = 'line';

    let i = 0;
    while (i < lyrics.length || i < chords.length) {
      let chordSegment = '';
      let lyricChar = lyrics[i] || ' ';

      // Find chord at position
      if (chords[i] && chords[i] !== ' ') {
        let j = i;
        while (j < chords.length && chords[j] !== ' ') {
          chordSegment += chords[j];
          j++;
        }
      }

      const pairDiv = document.createElement('div');
      pairDiv.className = 'pair';

      const chordSpan = document.createElement('span');
      chordSpan.className = 'chord';
      chordSpan.textContent = chordSegment;

      const lyricSpan = document.createElement('span');
      lyricSpan.className = 'lyric';
      lyricSpan.textContent = lyricChar;

      pairDiv.appendChild(chordSpan);
      pairDiv.appendChild(lyricSpan);
      lineDiv.appendChild(pairDiv);
      i++;
    }
    container.appendChild(lineDiv);
  }

  function renderPlainLine(text, container) {
    const lineDiv = document.createElement('div');
    lineDiv.className = 'line';
    lineDiv.textContent = text;
    container.appendChild(lineDiv);
  }

  function renderChordProLine(lineText, container) {
    const lineDiv = document.createElement('div');
    lineDiv.className = 'line';
    const regex = /(?:\[([^\]]+)\])?([^\[]*)/g;
    let match;

    while ((match = regex.exec(lineText)) !== null) {
      if (!match[0]) break;
      const pairDiv = document.createElement('div');
      pairDiv.className = 'pair';

      const chordSpan = document.createElement('span');
      chordSpan.className = 'chord';
      chordSpan.textContent = match[1] || '';

      const lyricSpan = document.createElement('span');
      lyricSpan.className = 'lyric';
      lyricSpan.textContent = match[2] || '';

      pairDiv.appendChild(chordSpan);
      pairDiv.appendChild(lyricSpan);
      lineDiv.appendChild(pairDiv);
    }
    container.appendChild(lineDiv);
  }
</script>
